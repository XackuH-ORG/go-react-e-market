services:
  postgres:
    image: postgres:18-alpine
    container_name: emarket_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: emarket
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s

  migrator:
    image: gomicro/goose
    container_name: emarket_migrator
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/internal/adapters/postgresql/migrations:/migrations
    command: ["goose", "-dir", "/migrations", "postgres", "host=postgres user=postgres password=admin dbname=emarket sslmode=disable", "up"]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: emarket_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      HTTP_ADDR: "0.0.0.0:8080"
      GOOSE_DBSTRING: "host=postgres user=postgres password=admin dbname=emarket sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: emarket_frontend
    restart: unless-stopped
    ports:
      - "3000:8080"
    depends_on:
      - backend

volumes:
  postgres-data: