services:
  postgres:
    image: postgres:18-alpine
    container_name: emarket_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: emarket
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s
    
  adminer:
    image: adminer:standalone
    container_name: emarket_adminer
    restart: unless-stopped
    ports:
      - "8083:8080"
    depends_on:
      - postgres

volumes:
  postgres-data: