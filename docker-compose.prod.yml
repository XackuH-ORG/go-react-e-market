services:
  postgres:
    image: postgres:18-alpine
    container_name: emarket_db_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      POSTGRES_DB: ${POSTGRES_DB:-emarket}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s
    networks:
      - emarket-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: emarket_backend_prod
    restart: always
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      DB_NAME: ${POSTGRES_DB:-emarket}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - emarket-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: emarket_frontend_prod
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - emarket-net

volumes:
  postgres-data:

networks:
  emarket-net:
    driver: bridge
